name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres # secret-scan:allow ephemeral CI service container
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Formatting
        run: pnpm run format:check
      - name: Type check
        run: pnpm run typecheck
      - name: Secret scan
        run: pnpm run scan:secrets
      - name: Tests (server tests use the real PostgreSQL service)
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Frontend bundle scan
        run: pnpm run scan:bundle
      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level high
